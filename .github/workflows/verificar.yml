name: Verificar oficina

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Probar el instalador npm
        run: npm test
      - name: Comprobar el paquete con npx
        shell: pwsh
        run: |
          $packed = npm pack --pack-destination $env:RUNNER_TEMP --json | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP $packed.filename
          $preview = npx --yes --package="$archive" -- oficina-agentes install --agent cursor --target $env:RUNNER_TEMP --dry-run | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ('.cursor/agents/diseno-web.md' -notin $preview.files) { throw 'Cursor profile is missing from the npm package.' }
      - name: Comprobar perfiles generados
        shell: pwsh
        run: pwsh -NoProfile -File scripts/Build-Office.ps1 -Platform All -Check
      - name: Probar registro, contratos e instalación
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/Test-Office.Core.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/Test-Office.Skills.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/Test-Office.Install.ps1
          exit $LASTEXITCODE
